# Edge Reverse Proxy TLS Configuration
server {
    listen 443 ssl http2;
    server_name api.payment-cluster.internal;

    ssl_certificate /etc/ssl/certs/banking_rsa2048.crt;
    ssl_certificate_key /etc/ssl/certs/banking_rsa2048.key;

    # Deprecated cipher suites vulnerable to Harvest Now, Decrypt Later
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256';
    ssl_ecdh_curve prime256v1:secp384r1;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://upstream_app;
    }
}
